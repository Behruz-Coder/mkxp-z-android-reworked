name: Android CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
  push:
    paths:
      - 'app/**'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-22.04
    env:
      ARCH: linux-x86_64
      ANDROID_NDK_VERSION: 23.2.8568313

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake curl gpg xxd autoconf automake libtool pkg-config python3 unzip

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools ndk;23.2.8568313

      - name: Set up NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Get dependencies
        working-directory: ${{ github.workspace }}/app/jni
        run: |
          chmod +x get_deps.sh
          ./get_deps.sh

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: app/jni/build-*
          key: jni-build-${{ hashFiles('app/jni/Makefile') }}

      - name: Build libraries (ARMv7 32-bit)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/app/jni
        run: |
          HOST=armv7a-linux-androideabi TARGET=arm-linux-androideabi ABI=armeabi-v7a make
          make clean

      - name: Build libraries (ARMv8 64-bit)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}/app/jni
        run: |
          HOST=aarch64-linux-android TARGET=aarch64-linux-android ABI=arm64-v8a make
          make clean

      - name: Save cache
        id: cache-save
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/jni/build-*
          key: jni-build-${{ hashFiles('app/jni/Makefile') }}

      - name: Prepare mkxp-z files
        working-directory: ${{ github.workspace }}/app/jni/mkxp-z
        run: |
          chmod +x make_xxd.sh
          ./make_xxd.sh

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: ./gradlew assembleDebug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
